<!doctype html><meta charset=utf-8><title>mouse</title>
<style>body{font:16px sans-serif}.card{width:120px;height:40px;background:#cde;margin:8px;padding:6px;cursor:grab;position:absolute}
#a{left:20px;top:20px}#done{position:absolute;left:300px;top:20px;width:300px;height:160px;border:2px dashed #888;padding:6px}</style>
<div class=card id=a>Card A</div><div id=done class=lane>Done</div><pre id=log style="position:absolute;top:220px">none</pre>
<script>
const a=document.getElementById('a'),d=document.getElementById('done');let down=false;const L=[];
const log=s=>{L.push(s);document.getElementById('log').textContent=L.join(',')};
a.addEventListener('mousedown',()=>{down=true;log('down')});
addEventListener('mouseup',e=>{if(down){down=false;const r=d.getBoundingClientRect();
 if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){d.appendChild(a);a.style.position='static';log('dropped')}else log('up-outside')}});
</script>
